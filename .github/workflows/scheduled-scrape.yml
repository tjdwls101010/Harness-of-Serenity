# analysis_Serenity.db를 하루 두 번 채운다. 코드는 GitHub이 아니라 **내 맥에서** 돈다.
#
# 왜 self-hosted 러너인가: X 쿠키가 맥의 .env 에만 있다. 클라우드 러너에 쓰려면 쿠키를
#   secrets 로 복제해야 하고, 그러면 만료 때마다 갱신할 곳이 두 곳으로 갈라진다. 쿠키는
#   주기적으로 만료되므로 그 비용은 한 번이 아니라 계속 나간다.
#
# 왜 이 레포에서 self-hosted 가 위험하지 않은가: 이 레포는 **public** 이다. 그래서 트리거를
#   schedule 과 workflow_dispatch 로만 제한한다. **pull_request 계열 트리거는 절대 추가하지
#   않는다** — 포크 PR이 내 맥에서 임의 코드를 실행하는 고전적 RCE 경로이고, public 레포에
#   self-hosted 러너를 붙일 때 GitHub이 명시적으로 경고하는 바로 그것이다.
#   같은 이유로 로그에 트윗 본문과 쿠키를 절대 쓰지 않는다. **public 레포의 Actions 로그와
#   job summary 는 누구나 읽는다.** 코퍼스의 181행은 구독자 전용 유료 게시물이다.
#
# 왜 DB를 러너 체크아웃에서 다루나: data/analysis_Serenity.db 는 git이 추적하는 파일이다.
#   맥의 작업 트리를 직접 건드리면 하루 두 번씩 그 트리가 영구히 dirty해지고, 다른 세션의
#   git status 와 pull·checkout 이 매번 막힌다. 그래서 스크랩 대상은 체크아웃의 DB이고
#   main 이 유일한 진실이다. 로컬 사본은 git pull 로 따라온다.
#
# 왜 이 스케줄이 성기어도 되는가: 매 실행은 슬롯이 아니라 따라잡기다. 중복 10건 연속이면
#   멈추므로, 맥이 하루 자서 run 이 취소돼도 다음 한 번이 그 사이 트윗까지 가져간다.
#   **단, 한계가 있다** — X 타임라인은 과거로 무한히 페이지되지 않는다. 며칠이 아니라 몇 달을
#   놓치면 그 구간은 영영 복구할 수 없다. 그래서 워치독이 따로 있다.
#
# 제약:
#   - 스케줄 워크플로는 default 브랜치(main)에 있어야 발동한다.
#   - GitHub 크론은 UTC·best-effort다(수~수십 분 지연, 부하 시 건너뜀).
#   - 레포가 60일간 활동이 없으면 스케줄이 자동 비활성화된다. 이 워크플로는 스스로 커밋을
#     밀어 넣으므로 대체로 자기 자신을 살려 두겠지만, **거기에 의존하지 않는다.**
#   - 잡이 24시간 넘게 큐에 있으면 GitHub이 취소한다. 취소는 실패가 아니라 **알림이 가지
#     않는다** — 그래서 scrape-watchdog.yml 이 따로 있다.
#   - 맥이 09:00에 깨어 있어야 한다. 아니면 run은 큐에 있다가 깨울 때 실행된다(데이터는
#     무사하다). 필요하면 `sudo pmset repeat wakeorpoweron MTWRFSU 08:55:00`.

name: scheduled-scrape

on:
  schedule:
    # 09:00 · 21:00 KST = 00:00 · 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "중복 조기중단 없이 타임라인 전체 재순회 (--max-dups 0). 빨간 run 뒤 구멍 복구용"
        type: boolean
        default: false
      dry_run:
        description: "쓰기·커밋 없이 수집만 (--dry-run). 워크플로 자체를 시험할 때"
        type: boolean
        default: false

# 예약 run 끼리 겹치지 않게 직렬화한다. SQLite 자체 잠금도 있지만 여기서 막으면 애초에
# 러너를 점유하지 않는다. 실행이 1분이라 flock 같은 별도 원장은 필요 없다.
concurrency:
  group: serenity-scrape
  cancel-in-progress: false

permissions:
  contents: write # 갱신된 DB를 main에 커밋·푸시한다

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      # 레포 밖의 실제 .env — 쿠키 갱신 지점을 한 곳으로 유지한다.
      # **이 경로에는 공백이 있다.** 모든 전개를 반드시 따옴표로 감싼다.
      SERENITY_ENV: /Users/seongjin/Coding/Invest/Harness of Serenity/.env
      DB_PATH: data/analysis_Serenity.db

    steps:
      # ref: main 이 필수다. 이게 없으면 feature 브랜치에서 workflow_dispatch 했을 때
      # 그 브랜치를 체크아웃하고 DB 커밋을 거기에 밀어 넣는다.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # uv sync 가 없는 것이 맞다. serenity_scrape.py 는 PEP 723 인라인 의존성을
      # 선언하므로(twikit==2.3.3, python-dotenv) uv run 만으로 해결된다. twikit 은
      # 일부러 scripts/requirements.txt 에 없다 — 스크래핑 전용 의존성 트리가 분석
      # 파이프라인 설치를 깨뜨릴 수 있어서는 안 된다.
      - name: Scrape
        id: scrape
        env:
          FULL: ${{ inputs.full }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set +e   # 종료코드 1이 "불변조건 위반"이라는 신호이므로 셸이 먼저 죽으면 안 된다
          ARGS=""
          [ "$FULL" = "true" ] && ARGS="$ARGS --max-dups 0"
          [ "$DRY" = "true" ]  && ARGS="$ARGS --dry-run"
          # --db 를 주지 않는다: 기본값이 스크립트 위치 기준이라 체크아웃의 DB로 잡힌다.
          uv run scripts/serenity_scrape.py --env-file "$SERENITY_ENV" $ARGS \
            > "$RUNNER_TEMP/result.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # 커밋 게이트가 읽을 값만 뽑는다. jq 는 쓰지 않는다 — macOS 기본 설치에 없다.
      - name: Read result
        id: result
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          try:
              d = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "result.json").read_text())
          except Exception:
              d = {}
          by = d.get("new_by_type") or {}
          out = {
              "new_rows": d.get("new_rows", 0),
              "dry_run": str(d.get("dry_run", False)).lower(),
              "new_post": by.get("post", 0),
              "new_reply": by.get("reply", 0),
              "new_sub": by.get("subscriber", 0),
              "db_total": (d.get("db_totals") or {}).get("total", 0),
              "db_newest": d.get("db_newest_at") or "unknown",
              # detail 은 스크립트가 이미 한 줄로 접어서 준다(_safe_reason). GITHUB_OUTPUT
              # 은 KEY=VALUE 한 줄 형식이라 개행이 들어오면 조용히 깨진다.
              "error": d.get("error", ""),
              "detail": " ".join((d.get("detail") or "").split()),
          }
          for k, v in out.items():
              print(f"{k}={v}")
          PY

      # stdout JSON 한 장이 판정의 전부이므로 그것을 표로 접는다.
      # **이 스텝이 "Actions 로그에서 상황 추적"의 실제 해답이다.**
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib

          try:
              d = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "result.json").read_text())
          except Exception as e:
              print(f"## 결과를 읽지 못했다\n\n`{e}` — 위 로그를 직접 본다.")
              print("\n스크립트가 JSON을 내기도 전에 죽었다는 뜻이다. uv 의존성 해결 실패가 가장 흔하다.")
              raise SystemExit

          def table(title, rows):
              print(f"### {title}\n")
              print("| | |\n|---|---|")
              for k, v in rows:
                  print(f"| {k} | {v} |")
              print()

          err = d.get("error")
          ok = d.get("invariants_ok")

          # 에러가 있으면 조치가 맨 위에 있어야 한다. 이 문장이 6개월 뒤 새벽에 읽는 글이다.
          if err:
              print(f"## 실패 — `{err}`\n")
              print(f"> {d.get('detail', '')}\n")

          print(f"## {'수집 정상' if ok else '수집 실패'}"
                + (" (DRY RUN — 아무것도 쓰지 않았다)" if d.get("dry_run") else "") + "\n")

          by = d.get("new_by_type") or {}
          table("이번 실행", [
              ("확보 `new_rows`", f"**{d.get('new_rows', 0):,}건**"),
              ("유형 분해", f"post {by.get('post', 0)} · reply {by.get('reply', 0)}"
                          f" · subscriber {by.get('subscriber', 0)}"),
              ("가장 새로 저장한 글", d.get("newest_saved_at") or "—"),
              ("소요", f"{d.get('elapsed_seconds', 0):.1f}초"),
              ("쿠키 출처 `cookie_source`", f"`{d.get('cookie_source')}`"),
          ])

          # caught_up 이 이 시스템의 유일한 건강 신호다. "몇 행 받았나"가 아니라 "왜 멈췄나".
          rows = []
          for t in d.get("tabs") or []:
              rows.append((f"`{t['tab']}` 왜 멈췄나", f"`{t.get('stopped_reason')}`"))
              rows.append((f"`{t['tab']}` 최신성 증명 `caught_up`",
                           "✅ 예" if t.get("caught_up") else "❌ **아니오 — 구멍 가능성**"))
              if t.get("error"):
                  rows.append((f"`{t['tab']}` 오류", f"`{t['error']}`"))
          table("불변조건 — 이것이 참이어야 초록", rows or [("탭", "한 번도 걷지 못했다")])

          # 아래는 **실패 기준이 아니다.** 0이 아니어도 빨간불이 되지 않는다.
          lag = d.get("db_lag_hours")
          acct = d.get("account") or {}
          table("실패 아님 — 참고 수치", [
              ("DB 총계", f"{(d.get('db_totals') or {}).get('total', 0):,}건"),
              ("DB 유형별", " · ".join(f"{k} {v:,}" for k, v in (d.get("db_totals") or {}).items()
                                      if k != "total") or "—"),
              ("코퍼스 최신 `db_newest_at`", d.get("db_newest_at") or "—"),
              # 이 값으로는 **절대 빨간불이 되지 않는다.** 그가 안 썼을 뿐일 수 있고,
              # 조용한 한 주에 울리는 알림은 곧 무시하게 된다.
              ("코퍼스 지연 `db_lag_hours`",
               f"{lag:.1f}시간 — 그가 안 썼을 뿐일 수 있다. 이 값으로는 빨간불이 되지 않는다."
               if isinstance(lag, (int, float)) else "—"),
              ("읽은 페이지 / 트윗",
               " · ".join(f"{t['tab']} p{t['pages']}/{t['seen']}건" for t in (d.get("tabs") or [])) or "—"),
              ("재시도", sum(t.get("retries", 0) for t in (d.get("tabs") or []))),
              ("계정 총 게시물", f"{acct.get('statuses'):,}" if isinstance(acct.get("statuses"), int) else "—"),
          ])

          # 구멍이 생겼으면 복구 명령을 그대로 붙여 준다. 증분 설계상 그냥 두면
          # 다음 실행이 1페이지를 전부 중복으로 보고 멈춰서 영영 안 가져온다.
          if any(not t.get("caught_up") for t in (d.get("tabs") or [])):
              print("### 구멍 복구\n")
              print("이 run 은 최신성을 증명하지 못했다. 전체 재순회로 메운다:\n")
              print("```\ngh workflow run scheduled-scrape.yml -f full=true\n```\n")
          PY

      # ::error:: 는 run 페이지의 주석과 **실패 알림 메일 본문**에 그대로 들어간다.
      # Summary 스텝에서는 낼 수 없다 — 거기서는 stdout 이 $GITHUB_STEP_SUMMARY 로
      # 돌려져 있어서 주석 명령이 요약 파일에 글자로 박힐 뿐이다.
      # 값을 env 로 받는 이유: detail 에는 X가 준 예외 문구가 섞여 있어서 셸에 직접
      # 보간하면 주입 경로가 된다.
      - name: Annotate failure
        if: always() && steps.result.outputs.error != ''
        env:
          ERR: ${{ steps.result.outputs.error }}
          DETAIL: ${{ steps.result.outputs.detail }}
        run: |
          echo "::error title=serenity-scrape ${ERR}::${DETAIL}"

      # new_rows 는 의미 게이트, git diff 는 방어 게이트다. .backup 없이 같은 파일을
      # 그대로 쓰지만, 빈 쓰기 트랜잭션도 SQLite 헤더의 change counter 를 건드릴 수
      # 있어서 바이트 차이만 보면 조용한 날에도 2MB 커밋이 쌓인다.
      # --dry-run 은 new_rows 를 보고하면서 아무것도 쓰지 않으므로 별도 게이트가 필요하다.
      - name: Commit and push
        if: steps.result.outputs.new_rows != '0' && steps.result.outputs.dry_run == 'false'
        env:
          NEW_ROWS: ${{ steps.result.outputs.new_rows }}
          NEW_POST: ${{ steps.result.outputs.new_post }}
          NEW_REPLY: ${{ steps.result.outputs.new_reply }}
          NEW_SUB: ${{ steps.result.outputs.new_sub }}
          DB_TOTAL: ${{ steps.result.outputs.db_total }}
          DB_NEWEST: ${{ steps.result.outputs.db_newest }}
        run: |
          set -euo pipefail
          # git diff --quiet 는 차이가 있을 때 1로 끝난다. set -e 아래서 그대로 쓰면
          # 죽으므로 조건문 안에 둔다(조건 문맥에서는 -e 가 유예된다).
          if git diff --quiet -- "$DB_PATH"; then
            echo "새 행이 ${NEW_ROWS}건인데 바이트가 동일하다 — 커밋 생략. 위 로그를 확인하라."
            exit 0
          fi

          # 봇 명의로 남긴다. 매일 바뀌는 유일한 파일이라 사람 명의로 두면
          # git blame 과 git log --author 가 못 쓰게 된다.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$DB_PATH"   # 절대 -A 금지 — 다른 변경을 끌어들이지 않는다
          git commit -F - <<EOF
          chore(data): 트윗 DB 갱신 — 신규 ${NEW_ROWS}건

          scheduled-scrape 자동 수집. post ${NEW_POST} · reply ${NEW_REPLY} · subscriber ${NEW_SUB}.
          DB 총 ${DB_TOTAL}건, 최신 ${DB_NEWEST}.
          run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          # 푸시 인증은 actions/checkout 이 .git/config 에 심은 GITHUB_TOKEN 이다.
          # 맥의 gh keyring 을 쓰면 재부팅 후 잠긴 키체인 때문에 아무도 안 보는
          # 아침에 실패한다. 참고: GITHUB_TOKEN 푸시는 다른 워크플로를 발동시키지
          # 않는다 — 여기서는 그게 원하는 바지만(루프 없음), 훗날 on: push 워크플로를
          # 만들면 그건 조용히 안 돌게 된다.
          git push || { git pull --rebase --autostash && git push; }

      # 스크레이퍼가 계산한 불변조건 종료 코드를 job 결과로 그대로 전달한다.
      # 워크플로가 별도 판단을 만들면 수집 CLI와 GitHub 상태가 어긋날 수 있다.
      - name: Propagate exit code
        run: exit ${{ steps.scrape.outputs.code }}
